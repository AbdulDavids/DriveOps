name: iOS build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test on an available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select destination
        id: destination
        run: |
          # A bare `name=` destination leaves xcodebuild to default OS to
          # "latest", which fails whenever a name (e.g. "iPhone 16e") exists
          # at more than one installed runtime and none matches "latest" —
          # this is what broke the workflow previously. Picking a specific
          # simulator's `id:` (a UUID) sidesteps name/OS matching entirely.
          device_id=$(xcodebuild -showdestinations -project DriveOps.xcodeproj -scheme DriveOps 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | grep -v placeholder \
            | grep -o 'id:[^,]*' \
            | head -1 \
            | cut -d: -f2)
          if [ -z "$device_id" ]; then
            echo "No iPhone simulator destination found" >&2
            xcodebuild -showdestinations -project DriveOps.xcodeproj -scheme DriveOps
            exit 1
          fi
          echo "Using simulator id: $device_id"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -scheme DriveOps \
            -project DriveOps.xcodeproj \
            -destination "id=${{ steps.destination.outputs.device_id }}"

      - name: Test
        run: |
          xcodebuild test-without-building \
            -scheme DriveOps \
            -project DriveOps.xcodeproj \
            -destination "id=${{ steps.destination.outputs.device_id }}"
