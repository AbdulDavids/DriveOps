name: iOS build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test on an available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select destination
        id: destination
        run: |
          # xcodebuild resolves its own destinations, so ask it directly instead of a
          # separate tool (xcrun xctrace) that can disagree about what's installed —
          # that mismatch is what broke this workflow previously.
          device=$(xcodebuild -showdestinations -project DriveOps.xcodeproj -scheme DriveOps 2>/dev/null \
            | grep -o 'platform:iOS Simulator, [^}]*name:iPhone[^}]*' \
            | sed -E 's/.*name:([^}]+)\}?/\1/' \
            | sed -E 's/[[:space:]]+$//' \
            | head -1)
          if [ -z "$device" ]; then
            echo "No iPhone simulator destination found" >&2
            xcodebuild -showdestinations -project DriveOps.xcodeproj -scheme DriveOps
            exit 1
          fi
          echo "Using simulator: $device"
          echo "device=$device" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -scheme DriveOps \
            -project DriveOps.xcodeproj \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}"

      - name: Test
        run: |
          xcodebuild test-without-building \
            -scheme DriveOps \
            -project DriveOps.xcodeproj \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}"
